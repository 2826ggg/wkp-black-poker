<script>
async function detectByIP() {
  try {
    const res = await fetch("https://ipapi.co/json/");
    const data = await res.json();
    return data.country_code;
  } catch (e) {
    return null;
  }
}

function mapCountryToLang(country) {
  switch (country) {
    case "CN":
    case "TW":
    case "HK":
      return "zh";

    case "JP":
      return "jp";

    case "KR":
      return "kr";

    case "US":
    case "GB":
    default:
      return "en";
  }
}

window.onload = async function () {
  const country = await detectByIP();

  let lang;

  if (country) {
    lang = mapCountryToLang(country);
  } else {
    const browserLang = navigator.language;

    if (browserLang.startsWith("zh")) lang = "zh";
    else if (browserLang.startsWith("ja")) lang = "jp";
    else if (browserLang.startsWith("ko")) lang = "kr";
    else lang = "en";
  }

  setLang(lang);
};
let time = "08:30";
let date = "2026/06/22";

<div class="datetime">

function updateDateTime() {
  const now = new Date();
  // 格式化时间：08:30
  const timeStr = now.toTimeString().slice(0, 5);
  // 格式化日期：2024/06/22
  const dateStr = now.toLocaleDateString("zh-CN", {
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).replace(/\//g, "/");
  
  document.getElementById("current-time").textContent = timeStr;
  document.getElementById("current-date").textContent = dateStr;
}

// 页面加载时执行一次
updateDateTime();
// 每分钟更新一次
setInterval(updateDateTime, 60000);

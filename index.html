<!-- 报名区域 -->

<div class="signup-box">

<h2>📝 赛事报名</h2>

<form id="signupForm">


<label>姓名</label>

<input 
type="text"
id="name"
placeholder="请输入姓名"
required>


<label>手机号</label>

<input 
type="tel"
id="phone"
placeholder="请输入手机号"
required>


<label>邮箱</label>

<input 
type="email"
id="email"
placeholder="请输入邮箱"
required>



<label>选择地区</label>

<select id="country">

<option>中国</option>
<option>日本</option>
<option>台湾</option>
<option>韩国</option>
<option>美国</option>
<option>其他</option>

</select>



<label>选择赛事</label>

<select id="event">

<option>
WKP Black Series
</option>

<option>
VIP Championship
</option>

<option>
Online Tournament
</option>

</select>



<button type="submit">

立即报名

</button>


</form>

</div>


<style>


.signup-box{


background:#111;

padding:25px;

margin:20px;

border-radius:10px;

border:1px solid #333;


}



.signup-box h2{

color:gold;

text-align:center;

}



.signup-box label{


display:block;

margin-top:15px;

color:#aaa;

}



.signup-box input,
.signup-box select{


width:100%;

padding:12px;

margin-top:8px;

background:#000;

border:1px solid #444;

color:white;

border-radius:5px;


}



.signup-box button{


margin-top:25px;

width:100%;

padding:15px;


background:gold;

border:none;

font-size:16px;

font-weight:bold;

border-radius:5px;

cursor:pointer;


}



</style>
<script>


document
.getElementById("signupForm")
.addEventListener(
"submit",
function(e){


e.preventDefault();



let user={


name:
document.getElementById("name").value,


phone:
document.getElementById("phone").value,


email:
document.getElementById("email").value,


country:
document.getElementById("country").value,


event:
document.getElementById("event").value,


time:
new Date().toLocaleString()


};



console.log(user);



/*
发送给后台
*/

fetch(
"http://localhost:3000/api/signup",
{

method:"POST",

headers:{


"Content-Type":
"application/json"


},


body:
JSON.stringify(user)


}

);



alert(
"报名成功，进入支付页面"
);



window.location.href=
"payment.html";



});



</script>

<!DOCTYPE html>
<html lang="zh">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WKP Black Series</title>


<style>

body{

margin:0;

background:#000;

color:white;

font-family:Arial;

}



.nav{

display:flex;

justify-content:space-between;

padding:15px;

border-bottom:1px solid #333;

}



.logo{

color:gold;

font-weight:bold;

}



.lang button{

background:#111;

color:white;

border:1px solid gold;

padding:6px;

margin-left:5px;

}



/* 黑金封面 */


.cover{

height:70vh;

display:flex;

justify-content:center;

align-items:center;

text-align:center;

position:relative;


}



.cover-bg{


position:absolute;

width:100%;

height:100%;


background:

linear-gradient(
rgba(0,0,0,.6),
rgba(0,0,0,.9)
),

url("cover.jpg");

background-size:cover;

background-position:center;


}



.cover-content{

position:relative;

z-index:2;


}



.cover h1{

font-size:45px;

color:gold;


}



.cover button{


background:gold;

padding:15px 40px;

border:0;

font-weight:bold;

}




.section{

padding:20px;

}



.card{


background:#111;

border:1px solid #333;

padding:15px;

margin:10px 0;


}



/*报名*/


.signup-box{


background:#111;

margin:20px;

padding:20px;

border-radius:10px;


}



.signup-box h2{


text-align:center;

color:gold;


}


label{


display:block;

margin-top:15px;

color:#aaa;


}



input,
select{


width:100%;

padding:12px;

margin-top:8px;

background:#000;

color:white;

border:1px solid #555;

box-sizing:border-box;


}



.submit{


margin-top:20px;

width:100%;

padding:15px;

background:gold;

border:0;

font-weight:bold;


}



</style>

</head>



<body>



<div class="nav">


<div class="logo">

WKP BLACK SERIES

</div>


<div class="lang">


<button onclick="setLang('zh')">

中文

</button>


<button onclick="setLang('en')">

EN

</button>


<button onclick="setLang('jp')">

日本語

</button>


</div>


</div>





<!-- 封面 -->


<div class="cover">


<div class="cover-bg"></div>


<div class="cover-content">


<h1>

WKP BLACK SERIES

</h1>


<p id="coverText">

全球黑金扑克赛事

</p>


<button onclick="goSignup()">

立即报名

</button>


</div>


</div>






<div class="section">


<h2 id="eventTitle">

🔥 即将赛事

</h2>


<div class="card">

WKP Black Series

</div>


<div class="card">

VIP Championship

</div>


<div class="card">

Online Tournament

</div>


</div>






<!--报名-->


<div class="signup-box">


<h2>

📝

<span id="formTitle">

立即报名

</span>

</h2>




<form id="signupForm">


<label>
姓名
</label>


<input id="name"
placeholder="姓名"
required>




<label>
手机号
</label>


<input id="phone"
placeholder="手机号"
required>




<label>
邮箱
</label>


<input id="email"
type="email"
placeholder="邮箱"
required>




<label>
国家

</label>


<select id="country"
onchange="changeCountry(this.value)">



<option value="CN">
中国
</option>


<option value="JP">
日本
</option>


<option value="KR">
韩国
</option>


<option value="US">
美国
</option>


<option value="GB">
英国
</option>


</select>





<label>

赛事

</label>


<select id="event">


<option>

WKP Black Series

</option>


<option>

VIP Championship

</option>


</select>




<button class="submit">

提交报名

</button>



</form>



</div>






<script>


const i18n={


zh:{


title:"全球黑金德州扑克赛事平台",

desc:"高端赛事 · 全球玩家",

event:"🔥 即将赛事",

form:"立即报名",

cover:"全球黑金扑克赛事"


},



en:{


title:"Global Black Poker Tournament",

desc:"Global Events",

event:"🔥 Events",

form:"Register",

cover:"Global Poker Championship"


},



jp:{


title:"グローバルポーカー大会",

desc:"世界大会",

event:"🔥 大会",

form:"参加登録",

cover:"世界ポーカー大会"


},



kr:{


title:"글로벌 포커 대회",

desc:"글로벌 이벤트",

event:"🔥 대회",

form:"참가 신청",

cover:"글로벌 포커 챔피언십"


}



};





function setLang(lang){


let t=i18n[lang];


document
.getElementById("eventTitle")
.innerText=t.event;


document
.getElementById("formTitle")
.innerText=t.form;


document
.getElementById("coverText")
.innerText=t.cover;


}





async function detectIP(){


try{


let res=

await fetch(
"https://ipapi.co/json/"
);


let data=

await res.json();



let c=data.country_code;



let map={


CN:"zh",

TW:"zh",

HK:"zh",

JP:"jp",

KR:"kr",

US:"en",

GB:"en"


};



return map[c]||"en";



}catch{


return "en";


}


}



detectIP()

.then(lang=>{

setLang(lang);

});






function changeCountry(c){


let map={


CN:"zh",

JP:"jp",

KR:"kr",

US:"en",

GB:"en"


};


setLang(
map[c]
);


}





function goSignup(){


document
.querySelector(".signup-box")
.scrollIntoView();


}





document
.getElementById("signupForm")
.addEventListener(
"submit",

async function(e){


e.preventDefault();



let user={


name:
name.value,


phone:
phone.value,


email:
email.value,


country:
country.value,


event:
event.value


};




await fetch(

"http://localhost:3000/api/signup",

{


method:"POST",


headers:{


"Content-Type":

"application/json"


},


body:

JSON.stringify(user)


}

);



alert(
"报名成功"
);



window.location.href=
"payment.html";



});



</script>



</body>

</html>
